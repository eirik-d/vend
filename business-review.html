body { font-family: "Vend Sans", -apple-system, BlinkMacSystemFont, sans-serif; background: #F8F5F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.gate { text-align: center; max-width: 420px; padding: 40px; }

.gate .subtitle { font-size: 14px; color: #7A7A7A; margin-bottom: 32px; }
.gate input { width: 100%; padding: 14px 18px; font-size: 16px; border: 2px solid #E5E0DA; border-radius: 8px; outline: none; text-align: center; font-family: inherit; background: white; transition: border-color 0.2s; }
.gate input:focus { border-color: #7A2822; }
.gate input.error { border-color: #B91C1C; animation: shake 0.4s; }

.gate button { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: white; background: #7A2822; border: none; border-radius: 8px; cursor: pointer; margin-top: 12px; font-family: inherit; transition: background 0.2s; }
.gate button:hover { background: #5C1E1A; }
.gate .hint { font-size: 12px; color: #BBC0C2; margin-top: 16px; }
.spinner { display:none; margin:16px auto; width:24px; height:24px; border:3px solid #E5E0DA; border-top-color:#7A2822; border-radius:50%; animation:spin 0.6s linear infinite; }

<script>
document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") unlock(); });
async function unlock() {
  const pw = document.getElementById("pw");
  const spin = document.getElementById("spin");
  const password = pw.value;
  if (!password) { pw.classList.add("error"); setTimeout(()=>pw.classList.remove("error"),400); return; }
  spin.style.display = "block";
  try {
    const b64 = DATA;
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const salt = raw.slice(0, 16); const iv = raw.slice(16, 28); const tag = raw.slice(28, 44); const ct = raw.slice(44);
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const combined = new Uint8Array(ct.length + tag.length); combined.set(ct); combined.set(tag, ct.length);
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, combined);
    const html = new TextDecoder().decode(decrypted);
    document.open(); document.write(html); document.close();
  } catch (e) {
    spin.style.display = "none"; pw.value = ""; pw.placeholder = "Wrong password";
    pw.classList.add("error"); setTimeout(() => pw.classList.remove("error"), 400);
  }
}
