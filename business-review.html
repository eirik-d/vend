.gate button:disabled { background: #C4A9A6; cursor: not-allowed; }
.gate .hint { font-size: 12px; color: #BBC0C2; margin-top: 16px; }

.step { display: none; }
.step.active { display: block; }

let decryptedHtml = null;

document.getElementById("pw").addEventListener("keydown", e => { if(e.key==="Enter") checkPassword(); });
document.getElementById("nameSelect").addEventListener("change", function() {
  document.getElementById("continueBtn").disabled = !this.value;
});

async function checkPassword() {
  const pw = document.getElementById("pw");
  const spin = document.getElementById("spin");
  pw.classList.remove("error");
  spin.style.display = "block";
  try {
    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(SALT), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(IV), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(CT), c => c.charCodeAt(0));
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pw.value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    decryptedHtml = new TextDecoder().decode(decrypted);
    spin.style.display = "none";
    document.getElementById("step1").classList.remove("active");
    document.getElementById("step2").classList.add("active");
  } catch(e) {
    spin.style.display = "none";
    pw.classList.add("error");
    pw.value = "";
    pw.placeholder = "Wrong password";
    pw.focus();
  }
}

function showContent() {
  const name = document.getElementById("nameSelect").value;
  const fullLabel = document.getElementById("nameSelect").selectedOptions[0].text;
  const reviewHtml = '<span style="font-size:13px;color:#7A7A7A;">Reviewing as</span> <span style="font-size:13px;font-weight:600;color:#7A2822;">' + fullLabel + '</span><input type="hidden" id="commenterSelect" value="' + name + '">';
  const html = decryptedHtml.replace(
    /<div class="review-controls">[\s\S]*?<\/div>\s*(?=\n\s*<!--)/,
