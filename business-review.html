<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vend Real Estate — Pre-read</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDKCVECYNpbGX-9ZDfmGJoByfqoOH5gvCg",
  databaseURL:"https://html-colab-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"html-colab"
});
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F5F0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate{text-align:center;max-width:420px;padding:40px}
.gate .logo{font-size:28px;font-weight:800;color:#7A2822;margin-bottom:8px;letter-spacing:-0.02em}
.gate .subtitle{font-size:14px;color:#7A7A7A;margin-bottom:32px}
.gate input,.gate select{width:100%;padding:14px 18px;font-size:16px;border:2px solid #E5E0DA;border-radius:8px;outline:none;text-align:center;font-family:inherit;background:white;transition:border-color 0.2s;-webkit-appearance:none;appearance:none}
.gate input:focus,.gate select:focus{border-color:#7A2822}
.gate input.error{border-color:#B91C1C;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.gate button{width:100%;padding:14px;font-size:15px;font-weight:600;color:white;background:#7A2822;border:none;border-radius:8px;cursor:pointer;margin-top:12px;font-family:inherit;transition:background 0.2s}
.gate button:hover{background:#5C1E1A}
.gate button:disabled{background:#C4A9A6;cursor:not-allowed}
.gate .hint{font-size:12px;color:#BBC0C2;margin-top:16px}
.spinner{display:none;margin:16px auto;width:24px;height:24px;border:3px solid #E5E0DA;border-top-color:#7A2822;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step{display:none}.step.active{display:block}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="logo">Vend Real Estate</div>
  <div class="subtitle">Business Review T1 2026 — Pre-read</div>
  <div class="step active" id="step1">
    <input type="password" id="pw" placeholder="Enter password" autocomplete="off" autofocus>
    <button onclick="checkPassword()">Open</button>
    <div class="spinner" id="spin"></div>
    <div class="hint">Restricted document — contact the author for access</div>
  </div>
  <div class="step" id="step2">
    <select id="nameSelect">
      <option value="" disabled selected>Select your name...</option>
      <option value="Christian">Christian Printzell Halvorsen — CEO</option>
      <option value="Per Christian">Per Christian Mørland — CFO</option>
      <option value="Antonia">Antonia Brandberg Björk — EVP People</option>
      <option value="Maria">Maria Sandgren — CPTO</option>
      <option value="Robin">Robin Suwe — EVP Mobility</option>
      <option value="Kjersti">Kjersti Høklingen — EVP Real Estate</option>
      <option value="Eddie">Eddie Sjølie — EVP Jobs</option>
      <option value="Cathrine">Cathrine Laksfoss — EVP Recommerce</option>
      <option value="Yale">Yale Varty — CCO</option>
      <option value="Aleksander">Aleksander Rosinski — VP Business Development</option>
      <option value="Eirik">Eirik Dysthe — RE Strategy</option>
      <option value="Ørjan">Ørjan Kronborg — RE Strategy</option>
      <option value="Erik">Erik Finnerman — Vend Strategy</option>
      <option value="Axel">Axel Hansson — RE Strategy</option>
    </select>
    <button id="continueBtn" onclick="showContent()" disabled>Continue</button>
  </div>
</div>
<script>
let D;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")checkPassword()});
document.getElementById("nameSelect").addEventListener("change",function(){document.getElementById("continueBtn").disabled=!this.value});
async function checkPassword(){
  const pw=document.getElementById("pw"),spin=document.getElementById("spin");
  pw.classList.remove("error");spin.style.display="block";
  try{
    if(!D){const r=await fetch("d.json");D=await r.json()}
    const enc=new TextEncoder(),
      salt=Uint8Array.from(atob(D.s),c=>c.charCodeAt(0)),
      iv=Uint8Array.from(atob(D.i),c=>c.charCodeAt(0)),
      ct=Uint8Array.from(atob(D.c),c=>c.charCodeAt(0)),
      km=await crypto.subtle.importKey("raw",enc.encode(pw.value),"PBKDF2",false,["deriveKey"]),
      key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]),
      dec=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
    window._html=new TextDecoder().decode(dec);
    spin.style.display="none";
    document.getElementById("step1").classList.remove("active");
    document.getElementById("step2").classList.add("active");
  }catch(e){
    spin.style.display="none";pw.classList.add("error");pw.value="";pw.placeholder="Wrong password";pw.focus();
  }
}
function showContent(){
  const name=document.getElementById("nameSelect").value,
    full=document.getElementById("nameSelect").selectedOptions[0].text;
  firebase.database().ref('business-review-t1-2026/logins').push({name:name,fullLabel:full,timestamp:Date.now(),time:new Date().toISOString()});
  const
    rev='<span style="font-size:13px;color:#7A7A7A;">Reviewing as</span> <span style="font-size:13px;font-weight:600;color:#7A2822;">'+full+'</span><input type="hidden" id="commenterSelect" value="'+name+'">',
    html=window._html.replace(/<div class="review-controls">[\s\S]*?<\/div>\s*(?=\n\s*<!--)/,'<div class="review-controls" style="display:flex !important;gap:6px;align-items:center;">'+rev+'</div>');
  document.open();document.write(html);document.close();
  setTimeout(()=>{const s=document.getElementById("commenterSelect");if(s){s.value=name;s.dispatchEvent(new Event("change"))}},500);
}
</script>
</body>
</html>
